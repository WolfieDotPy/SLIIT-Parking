<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SLIIT Parking · Admin</title><link rel="stylesheet" href="/style.css"></head><body><main class="wrap"><header class="bar"><b class="sp">SLIIT Parking · Admin</b><button class="pill" id="logout" hidden>Log out</button></header><section class="glass narrow" id="login"><h1>ADMIN LOGIN</h1><form id="loginForm"><label>Password</label><input id="password" type="password" required><button class="pill block">Log in</button></form></section><section id="app" hidden><div class="actions"><button class="pill" data-tab="payments">Payments</button><button class="pill" data-tab="students">Students</button><button class="pill" data-tab="enforcers">Enforcers</button><button class="pill" data-tab="fees">Fees</button><button class="pill" data-tab="settings">Settings</button></div><div class="glass" id="content"></div></section></main><script>
const key='tk_admin',$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,o={}){const h={Authorization:'Bearer '+localStorage[key]};if(o.body){h['Content-Type']='application/json';o.body=JSON.stringify(o.body)}const r=await fetch(url,{...o,headers:h}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}
const err=e=>alert(e.message);
$('#loginForm').onsubmit=async e=>{e.preventDefault();try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('#password').value})}),d=await r.json();if(!r.ok)throw Error(d.error);localStorage[key]=d.token;boot()}catch(x){err(x)}};
$('#logout').onclick=()=>{localStorage.removeItem(key);location.reload()};
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>load(b.dataset.tab));
async function boot(){try{await api('/api/admin/settings');$('#login').hidden=true;$('#app').hidden=false;$('#logout').hidden=false;load('payments')}catch{localStorage.removeItem(key)}}
async function load(tab){try{if(tab==='payments'){const rows=await api('/api/admin/payments');$('#content').innerHTML='<h3>Pending payments</h3>'+rows.map(p=>'<article class="row"><b>'+esc(p.student?.name||p.vehicle_reg)+'</b><span>'+esc(p.kind)+'</span><span>'+esc(p.amount)+'/=</span><button class="pill" onclick="slip('+p.id+')">Slip</button><button class="pill green" onclick="decide('+p.id+',true)">Approve</button><button class="pill red" onclick="decide('+p.id+',false)">Reject</button></article>').join('')||'<p>No pending payments.</p>'}
else if(tab==='settings'){const s=await api('/api/admin/settings');$('#content').innerHTML='<h3>Settings</h3><form id="settingsForm">'+['hourly_rate','pass_price','grace_minutes','plan_days'].map(k=>'<label>'+k.replaceAll('_',' ')+'</label><input name="'+k+'" type="number" min="0" value="'+esc(s[k])+'" required>').join('')+'<label>Bank information</label><textarea name="bank_info">'+esc(s.bank_info)+'</textarea><label>New admin password (optional)</label><input name="new_password" type="password" minlength="6"><button class="pill green">Save settings</button></form>';$('#settingsForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/admin/settings',{method:'PUT',body:Object.fromEntries(new FormData(e.target))});alert('Saved')}catch(x){err(x)}}}
else if(tab==='enforcers'){$('#content').innerHTML='<h3>Create enforcer</h3><form id="enf"><label>Name</label><input name="name" required><label>Contact</label><input name="contact" required><label>Password</label><input name="password" type="password" minlength="6" required><label>Confirm password</label><input name="confirm" type="password" required><button class="pill green">Create enforcer</button></form>';$('#enf').onsubmit=async e=>{e.preventDefault();try{const r=await api('/api/admin/enforcers',{method:'POST',body:Object.fromEntries(new FormData(e.target))});alert('Created '+r.code);e.target.reset()}catch(x){err(x)}}}
else{const r=await api('/api/admin/table/'+tab);$('#content').innerHTML='<h3>'+tab+'</h3><div style="overflow:auto"><table><thead><tr>'+r.cols.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>'+r.rows.map(row=>'<tr>'+r.cols.map(c=>'<td>'+esc(row[c])+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}}catch(e){err(e)}}
window.decide=async(id,ok)=>{try{const reason=ok?'':(prompt('Reason for rejection')||'Rejected');await api('/api/admin/payments/'+id+'/'+(ok?'approve':'reject'),{method:'PATCH',body:{reason}});load('payments')}catch(e){err(e)}};
window.slip=async id=>{try{const r=await fetch('/api/admin/slip/'+id,{headers:{Authorization:'Bearer '+localStorage[key]}});if(!r.ok)throw Error('Could not open slip');const u=URL.createObjectURL(await r.blob());window.open(u,'_blank')}catch(e){err(e)}};
boot();
</script></body></html>
