<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SLIIT Parking · Enforcer</title><link rel="stylesheet" href="/style.css"></head><body><main class="wrap"><header class="bar"><b class="sp">SLIIT Parking · Enforcer</b><button class="pill" id="logout" hidden>Log out</button></header><section class="glass narrow" id="login"><h1>ENFORCER LOGIN</h1><form id="loginForm"><label>Enforcer ID</label><input id="code" required><label>Password</label><input id="password" type="password" required><button class="pill block">Log in</button></form></section><section id="app" hidden><div class="glass"><h3 id="who">Vehicle lookup</h3><form id="lookup"><label>Student ID, QR token or vehicle registration</label><input id="term" required><button class="pill">Look up</button></form><div id="result"></div></div><div class="glass"><h3>Start parking session</h3><form id="start"><label>Vehicle registration</label><input name="vehicle_reg" required><label>Entry time</label><input name="start_time" type="datetime-local" required><button class="pill">Start session</button></form></div><div class="glass"><h3>Active drafts</h3><div id="drafts"></div></div><div class="glass"><h3>My recent fees</h3><div id="fees"></div></div></section></main><script>
const key='tk_enforcer',$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,o={}){const h={Authorization:'Bearer '+localStorage[key]};if(o.body){h['Content-Type']='application/json';o.body=JSON.stringify(o.body)}const r=await fetch(url,{...o,headers:h}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}
const err=e=>alert(e.message);
$('#loginForm').onsubmit=async e=>{e.preventDefault();try{const r=await fetch('/api/enforcer/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:$('#code').value,password:$('#password').value})}),d=await r.json();if(!r.ok)throw Error(d.error);localStorage[key]=d.token;boot()}catch(x){err(x)}};
$('#logout').onclick=()=>{localStorage.removeItem(key);location.reload()};
$('#lookup').onsubmit=async e=>{e.preventDefault();try{const r=await api('/api/enforcer/lookup?q='+encodeURIComponent($('#term').value));$('#result').innerHTML=r.found?'<p><b>'+esc(r.name)+'</b> · '+esc(r.code)+' · '+esc(r.reg)+' · '+esc(r.status)+'</p>':'<p>Unregistered vehicle: '+esc(r.reg)+'</p>'}catch(x){err(x)}};
$('#start').onsubmit=async e=>{e.preventDefault();try{await api('/api/enforcer/drafts',{method:'POST',body:Object.fromEntries(new FormData(e.target))});e.target.reset();refresh()}catch(x){err(x)}};
async function refresh(){try{const d=await api('/api/enforcer/fees?view=draft');$('#drafts').innerHTML=d.map(f=>'<article class="row"><b>'+esc(f.vehicle_reg)+'</b><span>'+esc(f.start_time)+'</span><button class="pill green" onclick="finish('+f.id+')">Finish</button></article>').join('')||'<p>No active drafts.</p>';const f=await api('/api/enforcer/fees');$('#fees').innerHTML=f.slice(0,20).map(x=>'<div class="row"><b>'+esc(x.vehicle_reg)+'</b><span>'+esc(x.status)+'</span><span>'+esc(x.amount)+'/=</span></div>').join('')||'<p>No fees yet.</p>'}catch(e){err(e)}}
window.finish=async id=>{const end=prompt('Enter leave time (YYYY-MM-DDTHH:mm)',new Date().toISOString().slice(0,16));if(!end)return;try{const r=await api('/api/enforcer/fees/'+id+'/finish',{method:'PATCH',body:{end_time:new Date(end).toISOString()}});alert('Fee: '+r.amount+'/=');refresh()}catch(e){err(e)}};
async function boot(){try{const u=await api('/api/enforcer/me');$('#who').textContent='Welcome, '+u.name+' ('+u.code+')';$('#login').hidden=true;$('#app').hidden=false;$('#logout').hidden=false;$('#start [name=start_time]').value=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16);refresh()}catch{localStorage.removeItem(key)}}
boot();
</script></body></html>
