name: Production smoke tests

on:
  workflow_dispatch:
    inputs:
      student_url:
        description: Student portal URL (optional)
        required: false
        type: string
      admin_url:
        description: Admin portal URL (optional)
        required: false
        type: string
      enforcer_url:
        description: Enforcer portal URL (optional)
        required: false
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run read-only production smoke tests
        env:
          STUDENT_URL: ${{ inputs.student_url || 'https://sliit-parking-beta.vercel.app' }}
          ADMIN_URL: ${{ inputs.admin_url || 'https://sliit-parking-admin.vercel.app' }}
          ENFORCER_URL: ${{ inputs.enforcer_url || 'https://sliit-parking-enforcer.vercel.app' }}
        run: npm run test:smoke
