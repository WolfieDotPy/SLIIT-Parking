<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet"><link rel="icon" href="/logo.png"><link rel="stylesheet" href="/style.css"><title>SLIIT Parking - Enforcer</title><script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script></head><body data-portal="enforcer" class="mobile"><div class="wrap">
<section class="view" id="login"><form class="glass" style="margin-top:40px" onsubmit="doLogin(event)"><h1>LOG IN</h1><p class="sub">To SLIIT Parking<br><b>Enforcer Portal</b></p><label>Enforcer ID Number</label><input id="lc" autocomplete="username" required><label>Password</label><input id="lp" type="password" required><br><button class="pill block">Login</button></form></section>

<section class="view hidden" id="home"><div class="glass who" style="margin-bottom:12px" id="who"></div>
<div class="glass scan" onclick="scan()"><span id="scanTxt">Click here to Scan<br>QR Code</span><div id="reader" class="hidden" style="width:100%"></div></div>
<form onsubmit="srch(event)"><input id="sq" placeholder="Search Student ID / Vehicle Number"></form><br>
<div class="actions" style="justify-content:center"><button class="pill" onclick="drafts()">Draft Fees</button><button class="pill" onclick="fees()">View Fees</button><button class="pill red" onclick="addFee('')">Add Fees</button></div><br><p class="center"><a href="#" onclick="logout();return false" class="small">Log out</a></p></section>

<section class="view hidden" id="result"><p><a href="#" onclick="show('home');return false">&lsaquo; Back</a></p><div class="glass" id="rd"></div>
<button class="pill red block" id="addbtn" onclick="addFee(R.reg)">Add Fees</button><p class="center small warn" id="addnote"></p><br><button class="pill block" onclick="show('home');scan()">Scan Again</button></section>

<section class="view hidden" id="addfee"><p><a href="#" onclick="show('home');return false">&lsaquo; Back</a></p><form class="fee-card" onsubmit="saveDraft(event)"><label>Vehicle No:</label><input id="av" maxlength="9" required><div class="small" id="avm"></div><label>Start Time:</label><input id="at" type="datetime-local" required><br><button class="pill block">Save Draft</button></form></section>

<section class="view hidden" id="drafts"><p><a href="#" onclick="show('home');return false">&lsaquo; Back</a></p><div class="glass"><h3>Draft Fees</h3><input id="dq" placeholder="Search" oninput="drawD()"><br><br><div id="dl"></div></div></section>

<section class="view hidden" id="fees"><p><a href="#" onclick="show('home');return false">&lsaquo; Back</a></p><div class="glass"><div id="ft"></div><input id="fq" placeholder="Search" oninput="drawF()"><br><br><div id="fl"></div></div></section>
</div><script src="/common.js"></script><script>
let R,SC,D=[],OPEN=null,F=[];
async function doLogin(e){e.preventDefault();try{const r=await api('/api/enforcer/login',{method:'POST',json:{code:$('#lc').value,password:$('#lp').value}});localStorage[K]=r.token;await home()}catch(x){toast(x.message,1)}}
async function home(){const m=await api('/api/enforcer/me');$('#who').innerHTML=`<div class="avatar">${esc(m.name[0])}</div><div><b>${esc(m.name)}</b><small>${esc(m.code)}</small></div>`;show('home')}
async function scan(){if(SC)return stopScan();$('#reader').classList.remove('hidden');$('#scanTxt').classList.add('hidden');SC=new Html5Qrcode('reader');
 try{await SC.start({facingMode:'environment'},{fps:10,qrbox:200},async t=>{await stopScan();check(t)})}catch{toast('Camera unavailable (needs HTTPS or localhost). Use the search box instead.',1);stopScan()}}
async function stopScan(){try{await SC.stop()}catch{}SC=null;$('#reader').classList.add('hidden');$('#scanTxt').classList.remove('hidden')}
function srch(e){e.preventDefault();check($('#sq').value)}
async function check(q){try{R=await api('/api/enforcer/lookup?q='+encodeURIComponent(q.trim()));
 if(R.found){const p=PASS[R.status];$('#rd').innerHTML=kv([['Student ID',R.code],['Status',p[0],p[1]],['Vehicle No',R.reg],['Vehicle Type',R.type],['Pass Validity',fmtD(R.expiry)],['Contact',R.contact],['Student Name',R.name],['Overdue Fees',R.overdue.n?money(R.overdue.total):'None',R.overdue.n?'bad':'ok']])}
 else $('#rd').innerHTML='<div class="center"><b>'+esc(R.reg)+'</b><p class="warn">Not a registered vehicle (visitor)</p></div>';
 const act=R.found&&R.status==='ACTIVE';$('#addbtn').disabled=act;$('#addnote').textContent=act?'Active pass - no fee can be added.':'';show('result')}catch(x){toast(x.message,1)}}
function addFee(reg){$('#av').value=reg;$('#av').dispatchEvent(new Event('input'));$('#at').value=nowLocal();show('addfee')}
async function saveDraft(e){e.preventDefault();try{await api('/api/enforcer/drafts',{method:'POST',json:{vehicle_reg:$('#av').value,start_time:new Date($('#at').value).toISOString()}});toast('Draft saved');show('home')}catch(x){toast(x.message,1)}}
async function drafts(){D=await api('/api/enforcer/fees?view=draft');OPEN=null;$('#dq').value='';drawD();show('drafts')}
function drawD(){const q=$('#dq').value.toLowerCase();$('#dl').innerHTML=D.filter(f=>f.vehicle_reg.toLowerCase().includes(q)).map(f=>f.id===OPEN?`<div class="row" style="display:block;cursor:default"><b>${esc(f.vehicle_reg)}</b><small>Started ${new Date(f.start_time).toLocaleString()}</small><label>Leave Time</label><input type="datetime-local" id="lt" value="${nowLocal()}"><p><button class="pill green" onclick="finish(${f.id})">Save</button> <button class="pill" onclick="OPEN=null;drawD()">Cancel</button></p></div>`:`<div class="row" onclick="OPEN=${f.id};drawD()"><b class="sp">${esc(f.vehicle_reg)}</b><span class="small">Add Exit Time</span></div>`).join('')||'<p class="center small">No drafts. Use Add Fees when a vehicle enters.</p>'}
async function finish(id){try{const r=await api(`/api/enforcer/fees/${id}/finish`,{method:'PATCH',json:{end_time:new Date($('#lt').value).toISOString()}});toast(r.amount?`Fee added: ${r.hours} hour(s) = ${money(r.amount)}`:'Within the free grace period - no fee');drafts()}catch(x){toast(x.message,1)}}
function fees(){show('fees');tabs('#ft',[['all','All'],['pending','Pending'],['unpaid','Unpaid']],loadF);$('#fq').value='';loadF('all')}
async function loadF(v){F=await api('/api/enforcer/fees?view='+v);drawF()}
function drawF(){const q=$('#fq').value.toLowerCase();$('#fl').innerHTML=F.filter(f=>f.vehicle_reg.toLowerCase().includes(q)).map(f=>`<div class="row" style="cursor:default"><b>${esc(f.vehicle_reg)}</b><span class="sp small">${fmtD(f.end_time||f.created_at)} - ${money(f.amount)}</span>${st(f.status)}</div>`).join('')||'<p class="center small">No fees found.</p>'}
regCheck($('#av'),$('#avm'),true);
if(localStorage[K])home().catch(()=>show('login'));
</script></body></html>
